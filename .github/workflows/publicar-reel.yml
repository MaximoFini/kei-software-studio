# Publica el próximo reel (cola manual de publicar/cola.json o reel diario) cuando pasaron "cada_dias" desde el último.
# Se dispara al instante cuando la tarea de Claude sube una rama claude/reel-diario-* (~11:40 Argentina).
# Los horarios de 12:07 y 14:07 son de respaldo: GitHub los demora horas o los saltea cuando tiene carga.
# El script publica como máximo un reel por día, así que nada se duplica.
name: Publicar reel

on:
  push:
    branches: ["claude/reel-diario-**"]
  schedule:
    - cron: "7 15 * * *"
    - cron: "7 17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publicar ya, sin esperar los días configurados"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-reel
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # en un push a la rama del reel, el código y la cola se leen de main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python scripts/publish_reel.py ${{ inputs.force && '--force' || '' }}

      - name: Guardar la cola actualizada
        run: |
          git diff --quiet publicar/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicar/
          git commit -m "Reel publicado: actualiza la cola"
          git push
